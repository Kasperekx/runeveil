    description: |
      Nieustępliwy wojownik pierwszej linii. Łączy potężne uderzenia
      z mobilnością potrzebną do prowadzenia natarcia.
    portrait: assets/ui/player-portrait.png
    selection:
      epithet: Ostrze pogranicza
      role: Natarcie
      difficulty: 1
      armor: Ciężki pancerz
      playstyle: Bezpośredni · ofensywny
      rune: ᛏ
      accent: copper
      preview: assets/players/human-warrior-v2/warrior-idle-down-1.png
      strengths:
        - Silne obrażenia wręcz
        - Szerokie ataki obszarowe
        - Stabilna wytrzymałość
    base:
      strength: 16
      agility: 10
      stamina: 14
      intellect: 5
      spirit: 8
    derived:
      baseHp: 40
      hpPerStamina: 5
      baseDamage: 8
      damagePerStrength: 0.5
      baseMoveSpeed: 110
      moveSpeedPerLevel: 2

  knight:
