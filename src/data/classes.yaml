# Playable classes (client + server).
# Default for new characters: defaultClass.
#
# Attributes (WoW-core): strength, agility, stamina, intellect, spirit
# Derived (server authoritative):
#   maxHp = baseHp + stamina * hpPerStamina
#   attackPower (bonus) = floor(baseDamage + strength * damagePerStrength)
#   auto-attack = uniform roll in [weaponMin + bonus, weaponMax + bonus]
#   moveSpeed = baseMoveSpeed + (level - 1) * moveSpeedPerLevel  (px/s, Tibia-lite)

defaultClass: warrior

equipmentSlots:
  - head
  - neck
  - shoulders
  - back
  - chest
  - wrists
  - hands
  - waist
  - legs
  - feet
  - finger1
  - finger2
  - trinket1
  - trinket2
  - mainHand
  - offHand

classes:
