# Creature catalog (client + server).
# Single source of truth for combat stats, loot, and display names.
#
# Art: sprites live under public/assets/creatures/<folder>/
# Paths below are folder + filePrefix for CreatureSprites.
# Player melee damage comes from attackPower (stats + gear), not this file.
#
# Loot table:
# - chance: percentage 0..100; omitted means guaranteed (legacy compatibility)
# - minQuantity/maxQuantity: inclusive quantity range after a successful roll
# - group: entries sharing a group use one roll, so at most one of them drops
# Ungrouped rows roll independently. A corpse is allowed to be empty.

combat:
  playerMaxHp: 100

creatures:
  boar:
    name: Dzik
    description: |
      Agresywny dzik z gęstego runu. Wytrzymały, wolniejszy od jelenia.
    sprites:
      folder: boar-v2
      filePrefix: boar-v2
    speed: 55
    animFps: 8
    hitRadius: 40
    collisionRadius: 24
    maxHp: 60
    respawnMs: 4000
    xp: 25
    loot:
      - item: boar_meat
        chance: 70
        minQuantity: 1
        maxQuantity: 2
      - item: health_potion_v2
        chance: 4
      - item: backpack
        chance: 0.4
        group: rare_gear
      - item: leather_chest
        chance: 0.8
        group: rare_gear
      - item: leather_helm
        chance: 1.2
        group: rare_gear
      - item: iron_shortsword
        chance: 0.5
        group: rare_gear
      - item: iron_greatsword
        chance: 0.45
        group: rare_gear
      - item: small_backpack
        chance: 1.2
        group: rare_gear
    attackDamage: 12
    attackRange: 46
    attackCooldownMs: 950
    aggroRange: 200

  deer:
    name: Jeleń
    description: |
      Płochliwy jeleń. Szybszy, ale mniej wytrzymały niż dzik.
    sprites:
      folder: deer
      filePrefix: deer
    speed: 70
    animFps: 8
    hitRadius: 38
    collisionRadius: 22
    maxHp: 40
    respawnMs: 4500
    xp: 15
    loot:
      - item: deer_meat
        chance: 60
        minQuantity: 1
        maxQuantity: 2
      - item: leather_boots
        chance: 2
        group: rare_gear
      - item: leather_legs
        chance: 1
        group: rare_gear
      - item: leather_shoulders
        chance: 1.4
        group: rare_gear
    attackDamage: 8
    attackRange: 44
    attackCooldownMs: 1100
    aggroRange: 170

  skeleton:
    name: Szkielet
    description: |
      Nieumarły wojownik błąkający się po obrzeżach obozowiska.
      Powolny, lecz nieustępliwy, gdy już wyczuje żywą ofiarę.
    sprites:
      folder: skeleton
      filePrefix: skeleton
      layout: cardinal-static
    renderScale: 0.72
    speed: 48
    animFps: 6
    hitRadius: 38
    collisionRadius: 18
    maxHp: 75
    respawnMs: 7000
    xp: 35
    loot:
      - item: health_potion_v2
        chance: 6
      - item: iron_shortsword
        chance: 2
        group: skeleton_gear
      - item: steel_longsword
        chance: 0.6
        group: skeleton_gear
      - item: leather_chest
        chance: 1
        group: skeleton_gear
    attackDamage: 14
    attackRange: 45
    attackCooldownMs: 1150
    aggroRange: 220
