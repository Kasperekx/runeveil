# Item catalog
#
# Art standard:
# - icon: 64×64 PNG, content ≤ 32×32, transparent background
# - worldScale: optional override; default = ITEM_WORLD_SCALE (~0.75 → ~24px on map)
#   Creatures render at scale 1; pickups should stay clearly smaller.
#
# use: optional. Items without it can sit on the action bar but do nothing.
#   heal:        hit points restored
#   cooldownMs:  per-item cooldown applied after a successful use
#   buff:        optional temporary Well Fed-style attribute bonus
#                Only one food buff can be active; a new meal replaces the old one.
#     durationMs: how long the buff lasts
#     strength / agility / stamina / intellect / spirit: flat bonuses
#
# capacity: optional. Marks the item as a container (bag) granting that many
#   inventory slots while equipped in a bag slot.
#
# buyPrice: vendor buy price in gold (required for shop listings).
# sellPrice: optional; vendor pays this when the player sells. Default = floor(buyPrice * 0.35).
# maxDurability: required for every wearable item (anything with `slot`).
# Consumables, materials and bags intentionally do not use durability, like in WoW.

