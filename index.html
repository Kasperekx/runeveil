<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/styles/inventory.css" />
    <title>Runeveil</title>
  </head>

  <body>
    <div id="app">
      <div id="pixi-container"></div>

      <div id="ui-root">
        <aside
          id="inventory"
          class="inventory"
          hidden
          aria-hidden="true"
          aria-label="Plecak"
        >
          <div class="inventory__frame">
            <div class="inventory__ornament inventory__ornament--tl" aria-hidden="true"></div>
            <div class="inventory__ornament inventory__ornament--tr" aria-hidden="true"></div>
            <div class="inventory__ornament inventory__ornament--bl" aria-hidden="true"></div>
            <div class="inventory__ornament inventory__ornament--br" aria-hidden="true"></div>
            <header class="inventory__header" id="inventory-header">
              <h2 class="inventory__title">Plecak</h2>
              <button
                type="button"
                class="inventory__close"
                id="inventory-close"
                aria-label="Zamknij plecak"
              >
                ×
              </button>
            </header>

            <div
              class="inventory__grid"
              id="inventory-grid"
              role="grid"
              aria-label="Sloty plecaka"
            ></div>

            <div
              class="inventory__bags"
              id="inventory-bags"
              aria-label="Gniazda toreb"
            ></div>

            <div
              class="inventory__money"
              id="inventory-money"
              aria-label="Złoto"
            >
              <img
                class="inventory__money-icon"
                src="/assets/items/gold-coin.png"
                alt=""
                width="18"
                height="18"
                draggable="false"
              />
              <span class="inventory__money-amount" id="inventory-gold">0</span>
            </div>
          </div>
        </aside>
      </div>

      <div
        id="boot-screen"
        class="boot-screen"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="boot-screen__backdrop" aria-hidden="true"></div>
        <div class="boot-screen__veil" aria-hidden="true"></div>
        <div class="boot-screen__grain" aria-hidden="true"></div>
        <div class="boot-screen__panel">
          <h1 id="boot-brand" class="boot-screen__brand">Runeveil</h1>
          <p class="boot-screen__tagline">Tam, gdzie zasłona staje się cienka.</p>
          <p id="boot-status" class="boot-screen__status">Budzenie run…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
